<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="gr-bg" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="gr-border" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <!-- Controller Fill Gradient -->
    <linearGradient id="gr-controller" x1="25" y1="35" x2="95" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Accent Highlights -->
    <linearGradient id="gr-accent" x1="30" y1="40" x2="90" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="gr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#gr-bg)" stroke="url(#gr-border)" stroke-width="2.5" />
  
  <!-- Subtle inner energy ring -->
  <rect x="12" y="12" width="96" height="96" rx="22" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1.5" />

  <!-- Modern Gaming Controller Crest -->
  <g filter="url(#gr-glow)">
    <!-- Controller Body -->
    <path d="M36 40 C44 38, 76 38, 84 40 C94 42, 100 52, 97 68 C95 78, 87 86, 78 84 C72 82, 68 74, 60 74 C52 74, 48 82, 42 84 C33 86, 25 78, 23 68 C20 52, 26 42, 36 40 Z" 
          fill="url(#gr-controller)" />
    
    <!-- Top Grip Contour Line -->
    <path d="M40 43 C48 42, 72 42, 80 43" 
          stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-linecap="round"/>

    <!-- D-Pad (Left Side) -->
    <path d="M38 52 L38 64 M32 58 L44 58" 
          stroke="#0b0f19" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="38" cy="58" r="1.5" fill="#34d399"/>

    <!-- Action Buttons (Right Side) -->
    <circle cx="76" cy="53" r="2.5" fill="#f43f5e"/>
    <circle cx="82" cy="58" r="2.5" fill="#eab308"/>
    <circle cx="76" cy="63" r="2.5" fill="#10b981"/>
    <circle cx="70" cy="58" r="2.5" fill="#3b82f6"/>

    <!-- Center Bridge Indicator / Signal -->
    <rect x="56" y="52" width="8" height="4" rx="2" fill="#0b0f19" opacity="0.8"/>
    <circle cx="60" cy="62" r="2" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
