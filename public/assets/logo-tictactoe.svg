<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="ttt-bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#161e31"/>
      <stop offset="100%" stop-color="#0c1220"/>
    </linearGradient>
    <linearGradient id="ttt-x-grad" x1="20" y1="20" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="ttt-o-grad" x1="52" y1="52" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="ttt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#06b6d4" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#ttt-bg)" stroke="rgba(6, 182, 212, 0.3)" stroke-width="2"/>
  
  <!-- Subtle Grid Lines -->
  <line x1="38" y1="18" x2="38" y2="82" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="62" y1="18" x2="62" y2="82" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="38" x2="82" y2="38" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="18" y1="62" x2="82" y2="62" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Glowing X Mark -->
  <g filter="url(#ttt-glow)">
    <line x1="22" y1="22" x2="34" y2="34" stroke="url(#ttt-x-grad)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="34" y1="22" x2="22" y2="34" stroke="url(#ttt-x-grad)" stroke-width="4.5" stroke-linecap="round"/>
    
    <line x1="66" y1="66" x2="78" y2="78" stroke="url(#ttt-x-grad)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="78" y1="66" x2="66" y2="78" stroke="url(#ttt-x-grad)" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Glowing O Mark -->
  <circle cx="72" cy="28" r="7" stroke="url(#ttt-o-grad)" stroke-width="4" fill="none"/>
  <circle cx="28" cy="72" r="7" stroke="url(#ttt-o-grad)" stroke-width="4" fill="none"/>
  
  <!-- Center Clash Spark -->
  <circle cx="50" cy="50" r="3.5" fill="#38bdf8"/>
</svg>
