<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="rps-bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#241a2f"/>
      <stop offset="100%" stop-color="#120c1a"/>
    </linearGradient>
    <linearGradient id="rps-grad1" x1="15" y1="20" x2="85" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="rps-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#ec4899" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#rps-bg)" stroke="rgba(236, 72, 153, 0.3)" stroke-width="2"/>

  <!-- Tri-Element Clash Geometry -->
  <g filter="url(#rps-glow)">
    <!-- Crossed Energy Blades (Scissors) -->
    <path d="M50 22 L76 72" stroke="#ec4899" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M50 22 L24 72" stroke="#8b5cf6" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Circular Shearing Rings -->
    <circle cx="28" cy="74" r="5.5" stroke="#8b5cf6" stroke-width="3" fill="none"/>
    <circle cx="72" cy="74" r="5.5" stroke="#ec4899" stroke-width="3" fill="none"/>

    <!-- Center Rock/Shield Core -->
    <polygon points="50,32 64,45 59,62 41,62 36,45" fill="url(#rps-grad1)"/>
    <circle cx="50" cy="49" r="4.5" fill="#ffffff" opacity="0.9"/>
  </g>
</svg>
